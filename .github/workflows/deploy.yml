name: Deploy to Namecheap via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v3
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json
        coverage: none
        
    - name: 📦 Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: 📦 Install NPM Dependencies
      run: npm ci
      
    - name: 🏗️ Build Frontend Assets
      run: npm run build
      
    - name: 🚢 Deploy to Server via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        port: 21
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/.env
          **/.env.example
          **/storage/logs/**
          **/README.md
          **/.gitignore
          **/.gitattributes
          **/.github/**
          
    - name: ✅ Deployment Complete
      run: |
        echo "🎉 Deployment to Namecheap completed successfully!"
        echo ""
        echo "📝 Post-Deployment Checklist:"
        echo "1. ✅ Files uploaded via FTP"
        echo "2. ✅ Frontend assets built and deployed"
        echo "3. ✅ Composer dependencies optimized"
        echo ""
        echo "⚠️ IMPORTANT - One-Time Setup Required:"
        echo "1. Create .env file on server (via cPanel File Manager)"
        echo "2. Set folder permissions: storage (755), bootstrap/cache (755)"
        echo "3. Point domain to /public_html/public directory"
        echo "4. Set up database connection in .env"
        echo ""
        echo "🔄 QUEUE WORKER - Scheduled Posts Feature:"
        echo "Your scheduled blog posts require a queue worker running."
        echo "Set up a cron job in cPanel to run every minute:"
        echo "  Command: cd /home/username/public_html && /usr/local/bin/php artisan schedule:run >> /dev/null 2>&1"
        echo ""
        echo "📌 To set up cron job:"
        echo "1. Login to cPanel → Cron Jobs"
        echo "2. Add new cron job with minute: * * * * *"
        echo "3. Command: cd /home/username/public_html && /usr/local/bin/php artisan schedule:run"
        echo ""
        echo "🌐 Visit your site: https://yourdomain.com"
