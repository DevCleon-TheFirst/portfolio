name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 Checkout Code
      uses: actions/checkout@v3
      
    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json
        coverage: none
        
    - name: 📦 Install Composer Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
      
    - name: 📁 Copy .env
      run: |
        echo "APP_NAME=\"DevCleon Portfolio\"" > .env
        echo "APP_ENV=production" >> .env
        echo "APP_DEBUG=false" >> .env
        echo "APP_URL=\${{ secrets.APP_URL }}" >> .env
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=\${{ secrets.DB_DATABASE }}" >> .env
        echo "DB_USERNAME=\${{ secrets.DB_USERNAME }}" >> .env
        echo "DB_PASSWORD=\${{ secrets.DB_PASSWORD }}" >> .env
        
    - name: 🔑 Generate Application Key
      run: php artisan key:generate --show
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: 📦 Install NPM Dependencies
      run: npm ci
      
    - name: 🏗️ Build Frontend Assets
      run: npm run build
      
    - name: 📂 Create Deployment Archive
      run: |
        tar -czf deployment.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='storage/*.log' \
          --exclude='tests' \
          .
          
    - name: 🚢 Deploy to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        source: "deployment.tar.gz"
        target: "/tmp"
        
    - name: 🔧 Execute Deployment Script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          set -e
          echo "🚀 Starting deployment..."
          
          # Navigate to deployment directory
          cd ${{ secrets.DEPLOY_PATH }}
          
          # Backup current version
          if [ -d "current" ]; then
            mv current backup_$(date +%Y%m%d_%H%M%S)
          fi
          
          # Extract new version
          mkdir -p current
          tar -xzf /tmp/deployment.tar.gz -C current
          rm /tmp/deployment.tar.gz
          
          # Navigate to new version
          cd current
          
          # Set up environment
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          
          # Run migrations
          php artisan migrate --force
          
          # Clear and cache
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan route:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          
          # Set permissions
          chmod -R 755 storage bootstrap/cache
          chown -R www-data:www-data storage bootstrap/cache
          
          # Create symbolic link for storage
          php artisan storage:link
          
          echo "✅ Deployment complete!"
          
    - name: ✅ Deployment Success
      if: success()
      run: echo "🎉 Deployment completed successfully!"
      
    - name: ❌ Deployment Failed
      if: failure()
      run: echo "💥 Deployment failed! Check the logs above."
